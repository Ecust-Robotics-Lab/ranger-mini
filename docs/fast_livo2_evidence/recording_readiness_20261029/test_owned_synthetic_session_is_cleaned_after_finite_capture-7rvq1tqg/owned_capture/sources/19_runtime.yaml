# Shared defaults. Environment overrides are explicit in runtime_config.py.
schema_version: 1
robot: ranger_mini_v2
sensors: mid360s_camera
odometry_backend: wheel
localization_backend: lightning
mapping_backend: lightning
terrain_backend: disabled
map_bundle: config/maps/field_20260928.yaml
# Mapping/frontend selection is independent of global localization.
# FAST-LIVO2 currently provides a LiDAR-IMU-camera frontend, not prior-map localization.
mapping:
  lightning:
    config: config/slam/ranger_mid360s.yaml
  fast_livo2:
    config: config/fast_livo2/ranger_mid360s_hik_trial.yaml
    camera_config: config/fast_livo2/camera_live.yaml
    lidar_config: config/fast_livo2/mid360s_live.json
    rviz_config: config/fast_livo2/live.rviz
    ros_domain_id: 175
    localhost_only: true
localization:
  native_pose_frame: lightning_imu_pose  # algorithm pose, not a physical sensor frame
  tf_max_age_s: 0.5  # preserve the previously effective threshold
  odom_max_age_s: 0.5
  odom_history_s: 2.0
  odom_max_gap_s: 0.1
  heartbeat_max_age_s: 0.5
  status_max_age_s: 10.0
  confidence_max_age_s: 1.0
  min_confidence: 1.0
  t_base_imu_xyz: [0.0, 0.0, 0.556]  # APPROXIMATE, not field calibrated
  t_base_imu_rpy: [0.0, 0.0, 0.0]
session:
  lidar_seconds: 3600
  initial_pose: [-0.85, -0.31, 0.0, 0.0, 0.0, -0.951, 0.309]
