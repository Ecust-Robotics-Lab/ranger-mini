# ranger_navigation — Nav2 1.1.20 (Humble) 参数（阶段 6 平地单点导航 v1）
# 参数名依据已安装版本源码/头文件核实（dpkg 1.1.20-1jammy.20260908），不照搬 Rolling。
#
# 车体: Ranger Mini V2（ugv_sdk ranger_params.hpp: min_turn_radius=0.4764, wheelbase=0.494,
#       track=0.364, max_linear=1.5 m/s）
# footprint: 用户确认外包络 0.74×0.52 m（PROVISIONAL: base_link 按几何中心，原点定义未核对；
#            来源两公开尺寸不一致 720×590 / 738×500，取长边 0.74、宽 0.52）
# 转弯半径一致性: 底盘 0.4764 < 门禁 0.55 < Smac/MPPI 0.60
# 速度 v1: MPPI/gate 上限 0.20 m/s（现场从低速起步再逐步放宽，改 motion_gate.yaml 即可收紧）

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""    # 由 launch 参数 map_yaml 注入（已验收地图 lightning-offline-suej7qsz）
    topic_name: map
    frame_id: map

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      motion_model_for_search: "DUBIN"      # v1 只前进不倒车（REEDS_SHEPP 未放行）
      minimum_turning_radius: 0.60          # > 底盘 0.4764，与 MPPI/门禁一致链
      allow_unknown: false                  # 未知区不当可行驶
      tolerance: 0.25
      smooth_path: true
      downsample_costmap: false
      downsampling_factor: 1
      angle_quantization_bins: 72
      reverse_penalty: 10.0                 # DUBIN 无倒车段，仅防御性配置
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0              # 必须等于 1/MPPI model_dt(0.05)，否则 MPPI 拒启
    action_monitor_rate: 20.0
    odom_topic: /wheel/odom                 # MPPI 初速度反馈（底盘体速度）
    controller_plugins: ["FollowPath"]
    # 目标判定容差：窄走廊内只能靠前进弧线调整朝向（原地转向被三重禁用），
    # 放宽到可达成范围；真机验证后再收紧
    goal_checker:
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 3.15   # 窄场地：到达即成功，不要求最终朝向（0.6m半径窄带内无法任意掉头）
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"   # Humble 插件名用 :: （/ 是新版风格）
      time_steps: 32
      model_dt: 0.05
      batch_size: 400
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"             # 与底盘 Dual Ackermann 行驶方式一致
      # 1.1.20 装机头文件核实：Ackermann 半径参数在子命名空间 AckermannConstraints 下
      AckermannConstraints:
        min_turning_r: 0.60
      vx_max: 0.10
      vx_min: 0.0                           # v1 禁倒车（连同 Smac DUBIN + 门禁三重）
      vy_max: 0.0
      wz_max: 0.50
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.30
      retry_attempt_limit: 2
      # critics 显式列出（对抗审查：代码默认值不可依赖；类名已对照装机
      # libmppi_critics.so 符号表核实存在；TwirlingCritic 属差速原地转向，禁用）
      critics: ["ConstraintCritic", "ObstaclesCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /wheel/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # 单点导航最小 BT：重规划循环，无恢复行为（v1 关闭倒车/原地旋转/清图等未验证恢复）
    default_nav_to_pose_bt_xml: ""          # 由 launch 注入包内 behavior_trees/single_point.xml
    # 1.1.20 configure 时会同时加载 through-poses 默认 BT（含 RecoveryNode），
    # 裁剪插件后无法解析 -> 指到同一最小 BT；本项目不使用 navigate_through_poses。
    default_nav_through_poses_bt_xml: ""    # 同样由 launch 注入
    # 只加载 BT 实际用到的插件（1.1.20 名称；未列任何恢复类插件）
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_rate_controller_bt_node
      - nav2_pipeline_sequence_bt_node

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"                   # 不依赖底盘速度反馈（其标定未验收）
    max_velocity: [0.12, 0.0, 0.70]         # 仅平滑角色，上限比 MPPI/门禁宽
    min_velocity: [0.0, 0.0, -0.70]         # 反向 x 钳到 0（三重禁倒车之一）
    # 加速度比值约束：max_accel_x/max_accel_wz >= 底盘 0.4764，避免起步/加速
    # 弯道的瞬态半径低于门禁阈值而被逐帧削波（对抗审查 note）
    max_accel: [0.30, 0.0, 0.60]
    max_decel: [-0.60, 0.0, -2.00]
    velocity_timeout: 0.5                   # 上游停发→0.5s 内开始减速归零
    deadband_velocity: [0.0, 0.0, 0.0]
    odom_topic: /wheel/odom
    odom_duration: 0.1

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true             # 未知≠可行驶（配合 Smac allow_unknown=false）
      # 窄口模式（2026-09-30 用户决定放宽）：圆形模型 0.20 m，比真实半宽(0.26)小
      # 6 cm/侧；真实车体防撞由 CM Stop 多边形(真实外形+0.08)兜底，门禁限速 0.10 m/s。
      # 可通过通道 >=0.80 m（真实足迹模型需 >=1.06 m，本场地大多 0.67-1.04 m）。
      # 停车窄口 0.67 m 仍不可自主通行（遥控通过）。
      robot_radius: 0.14
      footprint_padding: 0.0
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        transform_tolerance: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.60              # 外接半径 0.452 + 余量
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 3.0
      publish_frequency: 2.0
      resolution: 0.05
      rolling_window: true
      width: 5
      height: 5
      # 窄口模式（2026-09-30 用户决定放宽）：圆形模型 0.20 m，比真实半宽(0.26)小
      # 6 cm/侧；真实车体防撞由 CM Stop 多边形(真实外形+0.08)兜底，门禁限速 0.10 m/s。
      # 可通过通道 >=0.80 m（真实足迹模型需 >=1.06 m，本场地大多 0.67-1.04 m）。
      # 停车窄口 0.67 m 仍不可自主通行（遥控通过）。
      robot_radius: 0.14
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: cloud
        cloud:
          topic: /livox/obstacles           # ranger_obstacle_filter 输出（去自身点/限距）
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.10         # 与建图障碍带一致的离地带
          max_obstacle_height: 0.80
          obstacle_min_range: 0.30
          obstacle_max_range: 8.0
          raytrace_min_range: 0.30
          raytrace_max_range: 10.0
          expected_update_rate: 1.0         # 3.3 Hz 抽帧流，0.5 s 未见新帧即视为过期
          observation_persistence: 0.0
          inf_is_valid: false
          transform_tolerance: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.60
      always_send_full_costmap: true
