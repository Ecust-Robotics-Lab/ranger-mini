# Ranger Mini V2 + Mid-360S: 3D mapping candidate, NOT field calibrated.
# Raw /livox/imu acceleration is g; pinned ImuProcess infers and converts g to SI.
# p_I = R_IL p_L + t_IL. Manufacturer nominal t_LI was inverted.
# base_link installation remains UNKNOWN: no invented static TF.
# Livox offset_time ns / 1e6 -> ms; time_scale below is unused by Livox.
# ROI +/-20 m is a broad sensor-frame gate, NOT measured floor or obstacle height.
# Scan/map voxels 0.2 m; code may fall back to 0.1 m; saved maps use 0.1 m.
# loop with_height=false: avoids prior z=0. Map axes start in initial IMU axes; gravity is estimated, not forced vertical.
# g2p5 nulls deliberately fail initialization if enabled without measurements.
# system.pub_tf YAML is not consumed by this pinned code. SLAM creates no TF publisher.
# LocSystem has a separate pub_tf_ option defaulting true; localization is not launched.
# No localization executable is authorized by this configuration.
common:
  dataset: nclt
  lidar_topic: /ranger/unused_pointcloud2
  livox_lidar_topic: /livox/lidar
  imu_topic: /livox/imu
fasterlio:
  lidar_type: 1
  scan_line: 4
  blind: 0.1
  time_scale: 1e-3
  skip_lidar_num: 0
  point_filter_num: 4
  max_iteration: 4
  filter_size_scan: 0.2
  filter_size_map: 0.2
  ivox_grid_resolution: 0.2
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1
  use_aa: false
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_T:
  - -0.011
  - -0.02329
  - 0.04412
  extrinsic_R:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
  keep_first_imu_estimation: false
  kf_dis_th: 0.5
  kf_angle_th: 10.0
  enable_icp_part: false
  plane_icp_weight: 300.0
  min_pts: 500
  imu_filter: false
  proj_kfs: false
g2p5:
  esti_floor: false
  lidar_height: null
  floor_height: null
  min_th_floor: null
  max_th_floor: null
  grid_map_resolution: 0.05
system:
  with_loop_closing: true
  with_ui: false
  with_2dui: false
  with_g2p5: false
  step_on_kf: false
  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: ./data/new_map/
  pub_tf: false
loop_closing:
  loop_kf_gap: 5
  min_id_interval: 5
  closest_id_th: 20
  max_range: 5.0
  ndt_score_th: 1.3
  with_height: false
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: false
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  height_max: 20.0
  height_min: -20.0
  range_max: 70
  range_min: 3.0
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1
