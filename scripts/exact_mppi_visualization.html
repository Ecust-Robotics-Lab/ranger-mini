<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXACT-MPPI 离线证据回放</title>
<style>
:root{color-scheme:light;--ink:#17243c;--sub:#586a83;--blue:#2563eb;--line:#dfe6f0}
*{box-sizing:border-box}body{margin:0;background:#edf2f8;color:var(--ink);font:15px/1.6 system-ui,"Noto Sans CJK SC",sans-serif}
header{background:#14243d;color:white;padding:23px max(24px,calc((100vw - 1360px)/2));border-bottom:4px solid #20b6b0}
header h1{font-size:25px;margin:0 0 5px}header p{margin:0;color:#c0cede;font-size:14px}
main{max-width:1408px;margin:auto;padding:20px 24px 30px}.notice{padding:12px 16px;border:1px solid #efcf8e;border-radius:9px;background:#fff7e5;color:#72521c;margin-bottom:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button,select{font:inherit;border:1px solid #cad5e4;background:white;color:var(--ink);padding:8px 13px;border-radius:7px;cursor:pointer}button:hover{background:#eff5ff}button.active{background:var(--blue);border-color:var(--blue);color:white}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #a5c8ff;outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.panelhead{padding:15px 18px;border-bottom:1px solid var(--line)}.panelhead h2{margin:0;font-size:18px}.panelhead p{margin:3px 0 0;font-size:13px;color:var(--sub)}
#plot{display:block;width:100%;height:540px;background:#f6f8fc}.legend{display:flex;gap:16px;flex-wrap:wrap;padding:9px 17px;color:var(--sub);font-size:12px;border-top:1px solid var(--line)}.legend span::before{content:"";display:inline-block;width:10px;height:10px;background:var(--c);margin-right:5px;border-radius:2px}
.transport{padding:14px 16px;border-top:1px solid var(--line)}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.controls #time{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--sub)}#scrub{width:100%;accent-color:var(--blue);margin:12px 0}.options{display:flex;gap:15px;flex-wrap:wrap;font-size:13px;color:var(--sub)}.options label{cursor:pointer}
aside .panel{margin-bottom:14px}.detail{padding:15px 18px}dl{margin:0}dt{font-size:12px;color:var(--sub);margin-top:12px}dt:first-child{margin-top:0}dd{margin:2px 0 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.pill{display:inline-block;border-radius:5px;font-size:13px;padding:3px 9px;background:#eef2f8;color:#526079}.pill.ok{background:#e1f5ec;color:#087443}.pill.stop{background:#fff0e5;color:#a34a13}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin:13px 0}.numbers b{display:block;font-size:23px}.numbers small{color:var(--sub);font-size:11px}.note{font-size:12px;color:var(--sub);margin:10px 0 0}.bodymetric{font-size:13px;color:var(--sub);margin-top:10px}footer{font-size:12px;color:var(--sub);margin-top:18px}.muted{color:var(--sub)}.hidden{display:none}
@media(max-width:1000px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:12px}#plot{height:480px}}@media(max-width:620px){main{padding:12px}header{padding:18px}header h1{font-size:20px}aside{display:block}#plot{height:410px}.controls #time{margin-left:0}.notice{font-size:13px}}
</style>
<header><h1>EXACT-MPPI 离线证据回放</h1><p>Ranger Mini V2 · RTX 5060 / JAX CUDA · 实录输入与闭环仿真分开呈现</p></header>
<main>
<div class="notice" id="notice"></div>
<nav class="tabs" aria-label="证据类型"><button id="recordedTab" class="active">① 真实录包 · 局部查询</button><button id="simulationTab">② 闭环仿真 · 导航动作</button><select id="scenario" class="hidden" aria-label="选择仿真场景"></select></nav>
<div class="layout"><section class="panel">
<div class="panelhead"><h2 id="title"></h2><p id="subtitle"></p></div>
<canvas id="plot" role="img" aria-label="障碍、已观测覆盖、车体和轨迹的俯视图"></canvas>
<div class="legend"><span style="--c:#dfe5ee" id="unknownLegend">未知区域</span><span style="--c:#d97706" id="obstacleLegend">实录障碍体素</span><span style="--c:#0891b2">真实尺寸车体</span><span style="--c:#2563eb" id="guideLegend">查询参考</span><span style="--c:#7c3aed">局部预测</span><span style="--c:#059669" id="trailLegend" class="hidden">仿真行驶轨迹</span></div>
<div class="transport"><div class="controls"><button id="play">▶ 播放</button><button id="previous" aria-label="上一帧">←</button><button id="next" aria-label="下一帧">→</button><select id="speed" aria-label="回放倍速"><option value="1">1×时间</option><option value="4">4×时间</option><option value="8" selected>8×时间</option><option value="16">16×时间</option></select><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">－</button><span id="time"></span></div>
<input id="scrub" type="range" min="0" value="0" step="1" aria-label="回放时间轴">
<div class="options"><label><input id="showPrediction" type="checkbox" checked> 局部预测</label><label id="sampleOption"><input id="showSample" type="checkbox"> 突出优化采样点</label><label id="fullTrailOption" class="hidden"><input id="fullTrail" type="checkbox" checked> 显示仿真全程轨迹</label></div></div>
</section><aside>
<section class="panel"><div class="panelhead"><h2>当前帧</h2></div><div class="detail"><dl><dt>状态</dt><dd><span id="status" class="pill"></span></dd><dt>运动模式</dt><dd id="mode"></dd><dt>车体位置 / 朝向</dt><dd id="pose"></dd><dt id="commandLabel">未执行的首条预测速度</dt><dd id="command"></dd><dt>说明</dt><dd id="reason"></dd><dt id="stampLabel">录包原始采样戳 / ns</dt><dd id="stamp"></dd></dl><p class="bodymetric">车体轮廓 0.74 × 0.52 m；箭头指向车头。</p></div></section>
<section class="panel"><div class="panelhead"><h2 id="summaryTitle"></h2></div><div class="detail"><div class="numbers" id="numbers"></div><p class="note" id="summaryNote"></p><p class="note" id="source"></p></div></section>
</aside></div>
<footer>全部数据来自本机已保存的录包 / 离线重算。此文件不连接 ROS、底盘或网络；不发布速度。灰区不代表自由空间。完整原始证据保留，未执行实车导航。</footer>
</main>
<script id="evidence" type="application/json">__EVIDENCE_PAYLOAD__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('evidence').textContent);
const $=id=>document.getElementById(id),canvas=$('plot'),ctx=canvas.getContext('2d');
const MODE={DRIVE:'行驶 / 阿克曼',PARALLEL:'固定轮向平移',SPIN:'原地旋转'};
const REASON={valid:'独立几何与覆盖验证通过；预测没有执行',no_valid_trajectory:'未找到有效局部轨迹，保持停车',unobserved_sweep:'预测超出已观测范围，拒绝输出',obstacle_collision:'完整障碍点检查拒绝',tracking:'沿当前路径段跟踪',segment_end:'到达路径段末端，等待反馈停稳',mode_confirmed:'实际模式确认，继续执行',plan_accepted:'已接受新路径',new_goal:'目标已接受',goal_reached_and_stopped:'到达目标并满足连续停稳条件',segment_cross_track_replan:'实际停车位置偏离下一固定轮向路径，重新规划'};
const state={tab:'recorded',index:DATA.recorded_default,scenario:DATA.simulation.scenarios.findIndex(s=>s.name==='static_obstacle'),playing:false,clock:0,last:0,zoom:1};
let W=900,H=540,view=null;
DATA.recorded.frames.forEach(f=>{const bytes=Uint8Array.from(atob(f.known),c=>c.charCodeAt(0));f.grid=Array.from({length:6400},(_,i)=>(bytes[i>>3]>>(i&7))&1)});
DATA.simulation.scenarios.forEach(s=>{const opt=document.createElement('option');opt.textContent=DATA.names[s.name];opt.value=DATA.simulation.scenarios.indexOf(s);$('scenario').append(opt)});
$('scenario').value=state.scenario;
function currentSeries(){return state.tab==='recorded'?DATA.recorded.frames:DATA.simulation.scenarios[state.scenario].frames}
function point(x,y){return [W/2+(x-view.cx)*view.scale,H/2-(y-view.cy)*view.scale]}
function line(poses,color,width=2,dash=[]){if(!poses||poses.length<2)return;ctx.beginPath();poses.forEach((p,i)=>{const xy=point(p[0],p[1]);i?ctx.lineTo(...xy):ctx.moveTo(...xy)});ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])}
function dot(p,color,r=2){const xy=point(p[0],p[1]);ctx.fillStyle=color;ctx.beginPath();ctx.arc(...xy,r,0,Math.PI*2);ctx.fill()}
function rectangle(p,color,alpha=.18,width=2){const [x,y,a]=p,c=Math.cos(a),s=Math.sin(a);let points=[[.37,.26],[.37,-.26],[-.37,-.26],[-.37,.26]].map(([u,v])=>point(x+c*u-s*v,y+s*u+c*v));ctx.beginPath();points.forEach((v,i)=>i?ctx.lineTo(...v):ctx.moveTo(...v));ctx.closePath();ctx.fillStyle=color;ctx.globalAlpha=alpha;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function robot(p){rectangle(p,'#0891b2',.20,2.3);const c=Math.cos(p[2]),s=Math.sin(p[2]);line([[p[0],p[1]],[p[0]+c*.32,p[1]+s*.32]],'#087e93',3);const tip=[p[0]+c*.32,p[1]+s*.32];line([[tip[0]-.08*c-.05*s,tip[1]-.08*s+.05*c],tip,[tip[0]-.08*c+.05*s,tip[1]-.08*s-.05*c]],'#087e93',2)}
function setView(f){if(state.tab==='recorded'){view={cx:f.pose[0],cy:f.pose[1],scale:Math.min(W,H)/4.8*state.zoom}}else{const scenario=DATA.simulation.scenarios[state.scenario],pts=scenario.frames.map(f=>f.pose);pts.push(scenario.goal,[0,0,0]);let xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),lo=[Math.min(...xs)-.75,Math.min(...ys)-.75],hi=[Math.max(...xs)+.75,Math.max(...ys)+.75];view={cx:(lo[0]+hi[0])/2,cy:(lo[1]+hi[1])/2,scale:Math.min((W-90)/(hi[0]-lo[0]),(H-70)/(hi[1]-lo[1]))*state.zoom}}}
function gridAxes(f){const relative=state.tab==='recorded',origin=relative?f.pose:[0,0,0],extent=Math.max(W,H)/view.scale/2+1;let xmin=Math.floor(view.cx-extent),xmax=Math.ceil(view.cx+extent),ymin=Math.floor(view.cy-extent),ymax=Math.ceil(view.cy+extent);ctx.font='11px system-ui';ctx.textBaseline='bottom';for(let x=xmin;x<=xmax;x++){let a=point(x,ymin),b=point(x,ymax);ctx.strokeStyle='#cdd7e5';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}for(let y=ymin;y<=ymax;y++){let a=point(xmin,y),b=point(xmax,y);ctx.strokeStyle='#cdd7e5';ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}ctx.fillStyle='#52657d';for(let delta=-4;delta<=4;delta++){let x=relative?origin[0]+delta:delta,xy=point(x,view.cy);if(xy[0]>35&&xy[0]<W-25)ctx.fillText(`${relative?'Δ':''}X ${delta}m`,xy[0]+3,H-10)}ctx.save();ctx.translate(14,H/2);ctx.rotate(-Math.PI/2);ctx.fillText(relative?'odom 坐标；画面跟随实录基座位置':'合成场景坐标 / m',0,0);ctx.restore()}
function draw(){const frames=currentSeries(),f=frames[state.index];if(!f)return;const rect=canvas.getBoundingClientRect(),ratio=devicePixelRatio||1;W=rect.width;H=rect.height;if(canvas.width!==Math.round(W*ratio)||canvas.height!==Math.round(H*ratio)){canvas.width=Math.round(W*ratio);canvas.height=Math.round(H*ratio)}ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,W,H);setView(f);ctx.fillStyle=state.tab==='recorded'?'#dfe5ee':'#f8fafc';ctx.fillRect(0,0,W,H);
if(state.tab==='recorded'){ctx.fillStyle='#fff';const o=f.observer;for(let i=0;i<6400;i++)if(f.grid[i]){let x=o[0]-2+(i%80)*.05,y=o[1]-2+Math.floor(i/80)*.05,xy=point(x,y+.05);ctx.fillRect(xy[0],xy[1],.05*view.scale+.3,.05*view.scale+.3)}gridAxes(f);for(const p of f.points)dot(p,'#c47b28',1.7);if($('showSample').checked)for(const p of f.sampled)dot(p,'#e35b10',2.5);line(f.guidance,'#2563eb',1.8,[5,4]);if(f.mode==='SPIN'){let end=f.guidance.at(-1),a=end[2];line([end,[end[0]+.55*Math.cos(a),end[1]+.55*Math.sin(a)]],'#2563eb',1.5,[5,4])}}
else{const scenario=DATA.simulation.scenarios[state.scenario];gridAxes(f);ctx.fillStyle='#ef4444';for(const p of scenario.obstacles){let xy=point(p[0]-.025,p[1]+.025),size=.05*view.scale;ctx.fillRect(xy[0],xy[1],size+.2,size+.2)}let route=scenario.route_history[0];for(const r of scenario.route_history){if(r.time<=f.time)route=r;else break}for(const seg of route.segments)line(seg.poses,'#2563eb',1.4,[5,4]);const limit=$('fullTrail').checked?frames.length:state.index+1;line(frames.slice(0,limit).map(f=>f.pose),'#059669',2.5);const goal=scenario.goal;dot(goal,'#7c3aed',6);let g=point(goal[0],goal[1]);ctx.fillStyle='#6d28d9';ctx.font='13px system-ui';ctx.fillText('目标',g[0]+10,g[1]-8)}
if($('showPrediction').checked&&f.prediction.length&&(state.tab==='recorded'||(f.state==='EXECUTING'&&f.command.some(v=>Math.abs(v)>1e-8)))){line(f.prediction,'#7c3aed',2.5);rectangle(f.prediction.at(-1),'#7c3aed',.06,1.3)}robot(f.pose);ctx.fillStyle='#31465f';ctx.font='12px system-ui';ctx.fillText(state.tab==='recorded'?'实录环境｜紫色预测从未执行':'闭环仿真｜绿色为模型执行轨迹',22,24);updateDetails(f,frames);document.documentElement.dataset.visualizationReady='true'}
function updateDetails(f,frames){$('scrub').max=frames.length-1;$('scrub').value=state.index;$('time').textContent=`${f.time.toFixed(2)} / ${frames.at(-1).time.toFixed(2)} s · ${state.index+1}/${frames.length}`;$('mode').textContent=MODE[f.mode]||f.mode;$('pose').textContent=`x ${f.pose[0].toFixed(3)} m · y ${f.pose[1].toFixed(3)} m · ${(f.pose[2]*180/Math.PI).toFixed(1)}°`;$('command').textContent=`vx ${f.command[0].toFixed(3)} · vy ${f.command[1].toFixed(3)} m/s · ω ${f.command[2].toFixed(3)} rad/s`;$('reason').textContent=REASON[f.reason]||f.reason;if(state.tab==='recorded'){$('status').textContent=f.valid?'查询验证通过（未执行）':'拒绝输出 / 停车';$('status').className='pill '+(f.valid?'ok':'stop');$('stamp').textContent=f.stamp_ns}else{$('status').textContent=f.state;$('status').className='pill '+(f.state==='SUCCEEDED'?'ok':'');$('stamp').textContent=`${DATA.simulation.scenarios[state.scenario].route_history.length} 次路径版本`}}
function updateMode(){const real=state.tab==='recorded';$('recordedTab').classList.toggle('active',real);$('simulationTab').classList.toggle('active',!real);for(const name of ['scenario','trailLegend','fullTrailOption'])$(name).classList.toggle('hidden',real);for(const name of ['unknownLegend','sampleOption'])$(name).classList.toggle('hidden',!real);$('notice').textContent=real?'本页障碍与覆盖来自真实录包；紫色轨迹是本次新增的静止状态优化查询，没有执行。不能用它证明车沿该轨迹完成了导航。':'本页是合成场景中的运动模型闭环：命令改变后，模型位置随之改变。场景、障碍和轨迹均为仿真，不是录包里车辆实际自主导航的路线。';$('title').textContent=real?'录包环境与局部预测（可逐帧查看）':`闭环仿真 · ${DATA.names[DATA.simulation.scenarios[state.scenario].name]}`;$('subtitle').textContent=real?'pwr5lx7u · 同戳 FAST 区间云 + 同会话插值 wheel · 灰色区域为未知':'路径分段停稳 → 明确模式确认 → 控制执行 → 实际停稳位置重规划';$('obstacleLegend').textContent=real?'实录障碍体素':'仿真障碍';$('guideLegend').textContent=real?'人工短程查询参考':'当前全局路径';$('commandLabel').textContent=real?'未执行的首条预测速度':'模型执行的速度';$('stampLabel').textContent=real?'录包原始采样戳 / ns':'重规划 / 路径版本';$('summaryTitle').textContent=real?'本次可视化重算':'本次闭环仿真';if(real){$('numbers').innerHTML=`<div><b>${DATA.recorded.frames.length}</b><small>实录快照</small></div><div><b>${DATA.recorded.accepted}</b><small>查询通过</small></div><div><b>${DATA.recorded.rejected}</b><small>查询拒绝</small></div>`;$('summaryNote').textContent='原验收：119个输入 × 3轮 = 357次查询，150通过、207拒绝。下方119帧为可视化新重算；通过数不是导航任务成功率。速度初值均显式置零。';$('source').textContent='源包：bags/fast-livo-wheel_alignment_visit01-pwr5lx7u/raw'}else{const s=DATA.simulation.scenarios[state.scenario];$('numbers').innerHTML=`<div><b>9/9</b><small>场景通过</small></div><div><b>${s.result.simulated_seconds.toFixed(1)}s</b><small>该场景模拟时长</small></div><div><b>${s.result.collided?'有':'无'}</b><small>模型车体碰撞</small></div>`;$('summaryNote').textContent='包含前进、倒车、横移、斜行、原地旋转、左右转、静态绕障与窄门。紧绕障时停稳与重规划较多，因此完成较慢。';$('source').textContent='新增导出：scripts/validate_exact_mppi.py，使用同一导航算法、模式约束与独立扫掠检查。'}draw()}
function pause(){state.playing=false;$('play').textContent='▶ 播放'}
function switchTab(tab){pause();state.tab=tab;state.index=tab==='recorded'?DATA.recorded_default:0;state.zoom=1;updateMode()}
$('recordedTab').onclick=()=>switchTab('recorded');$('simulationTab').onclick=()=>switchTab('simulation');$('scenario').onchange=()=>{pause();state.scenario=Number($('scenario').value);state.index=0;state.zoom=1;updateMode()};$('scrub').oninput=()=>{pause();state.index=Number($('scrub').value);draw()};$('previous').onclick=()=>{pause();state.index=Math.max(0,state.index-1);draw()};$('next').onclick=()=>{pause();state.index=Math.min(currentSeries().length-1,state.index+1);draw()};$('play').onclick=()=>{if(state.playing)pause();else{if(state.index===currentSeries().length-1)state.index=0;state.clock=currentSeries()[state.index].time;state.last=performance.now();state.playing=true;$('play').textContent='❚❚ 暂停'}};for(const name of ['showPrediction','showSample','fullTrail'])$(name).onchange=draw;$('zoomIn').onclick=()=>{state.zoom=Math.min(4,state.zoom*1.25);draw()};$('zoomOut').onclick=()=>{state.zoom=Math.max(.4,state.zoom/1.25);draw()};document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('previous').click()});
function animate(t){if(state.playing){state.clock+=(t-state.last)/1000*Number($('speed').value);state.last=t;const fs=currentSeries();while(state.index<fs.length-1&&fs[state.index+1].time<=state.clock)state.index++;draw();if(state.index===fs.length-1)pause()}requestAnimationFrame(animate)}
const params=new URLSearchParams(location.search);
if(params.get('view')==='simulation'){state.tab='simulation';const found=DATA.simulation.scenarios.findIndex(s=>s.name===params.get('scene'));if(found>=0)state.scenario=found;state.index=0;const target=Number(params.get('time')||0);currentSeries().forEach((f,i)=>{if(f.time<=target)state.index=i});$('scenario').value=state.scenario}
new ResizeObserver(draw).observe(canvas);updateMode();requestAnimationFrame(animate);
</script>
</html>
